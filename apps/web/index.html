    <a class="skip-link" href="#main">Preskočiť na obsah</a>
    <div id="root"></div>
    <!--
      V dev móde: odregistrujeme akýkoľvek starý service worker, ktorý zostal po
      predošlom PWA buildi. Inak by užívateľovi v Chrome visel starý HTML/bundle
      a nové zmeny by sa neprejavili ani cez Cmd+R.
      V produkcii (Vite build) vite-plugin-pwa registruje čerstvý SW po dokončení.
    -->
    <script>
      (async () => {
        if (!('serviceWorker' in navigator)) return;
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          let unregistered = 0;
          for (const reg of regs) { await reg.unregister(); unregistered++; }
          if (unregistered > 0 && 'caches' in window) {
            const names = await caches.keys();
            for (const n of names) await caches.delete(n);
            // Reload raz, aby sa spustil fresh bundle bez SW interception
            if (!sessionStorage.getItem('dp.swReset')) {
              sessionStorage.setItem('dp.swReset', '1');
              location.reload();
            }
          }
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
